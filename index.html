<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EsToDoList</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-gray-100 min-h-screen">

  <!-- CABEÇALHO -->
  <header class="bg-blue-700 text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">

      <h1 class="text-xl md:text-3xl lg:text-4xl font-bold">
        EsToDoList
      </h1>

      <span class="hidden md:inline text-sm lg:text-base">
        Organize sua rotina escolar
      </span>

    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- GRID RESPONSIVO -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- COLUNA ESQUERDA -->
      <section class="min-w-0 bg-gray-950 border border-gray-800 rounded-xl shadow p-4 space-y-4">

        <!-- FORMULÁRIO -->
        <form class="flex flex-col gap-3">

          <input
            type="text"
            placeholder="Nova tarefa"
            class="w-full min-w-0 bg-gray-900 text-white border border-gray-700 rounded-lg px-3 py-3 focus:outline-none focus:border-green-500"
          >

          <input
            type="date"
            class="w-full min-w-0 bg-gray-900 text-white border border-gray-700 rounded-lg px-3 py-3"
          >

          <button
            type="button"
            class="w-full bg-blue-600 text-white rounded-lg px-4 py-3 font-semibold hover:bg-blue-500 transition"
          >
            Adicionar
          </button>

        </form>

        <!-- PESQUISA -->
        <input
          type="search"
          placeholder="Pesquisar tarefa..."
          class="w-full min-w-0 bg-gray-900 text-white border border-gray-700 rounded-lg px-3 py-3 focus:outline-none focus:border-green-500"
        >

        <!-- FILTROS -->
        <div class="flex flex-wrap gap-2">

          <button
            type="button"
            class="px-3 py-2 rounded-full bg-blue-600 text-white whitespace-nowrap text-sm"
          >
            Todas
          </button>

          <button
            type="button"
            class="px-3 py-2 rounded-full bg-gray-800 text-gray-200 hover:bg-gray-700 whitespace-nowrap text-sm"
          >
            Pendentes
          </button>

          <button
            type="button"
            class="px-3 py-2 rounded-full bg-gray-800 text-gray-200 hover:bg-gray-700 whitespace-nowrap text-sm"
          >
            Concluídas
          </button>

        </div>

      </section>

      <!-- LISTA DE TAREFAS: DUAS COLUNAS NO NOTEBOOK -->
      <section class="min-w-0 lg:col-span-2">

        <ul class="space-y-3">

          <!-- TAREFA 1 -->
          <li class="min-w-0 bg-gray-950 border border-gray-800 rounded-xl shadow p-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">

            <label class="flex items-start gap-3 min-w-0">
              <input
                type="checkbox"
                class="mt-1 w-5 h-5 shrink-0 accent-blue-500"
              >

              <span class="min-w-0 break-words">
                <span class="block font-medium">
                  Trabalho de História
                </span>
                <span class="text-sm text-gray-400">
                  20/10/2026
                </span>
              </span>
            </label>

            <div class="flex gap-2 md:shrink-0">

              <button
                type="button"
                class="px-4 py-3 rounded-lg bg-green-900 text-green-200 hover:bg-green-800"
              >
                Editar
              </button>

              <button
                type="button"
                class="px-4 py-3 rounded-lg bg-red-950 text-red-300 hover:bg-red-900"
              >
                Excluir
              </button>

            </div>
          </li>

          <!-- TAREFA 2 -->
          <li class="min-w-0 bg-gray-950 border border-gray-800 rounded-xl shadow p-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">

            <label class="flex items-start gap-3 min-w-0">
              <input
                type="checkbox"
                class="mt-1 w-5 h-5 shrink-0 accent-green-500"
              >

              <span class="min-w-0 break-words">
                <span class="block font-medium">
                  Estudar para a prova de Matemática
                </span>
                <span class="text-sm text-gray-400">
                  22/10/2026
                </span>
              </span>
            </label>

            <div class="flex gap-2 md:shrink-0">

              <button
                type="button"
                class="px-4 py-3 rounded-lg bg-green-900 text-green-200 hover:bg-green-800"
              >
                Editar
              </button>

              <button
                type="button"
                class="px-4 py-3 rounded-lg bg-red-950 text-red-300 hover:bg-red-900"
              >
                Excluir
              </button>

            </div>
          </li>

          <!-- TAREFA 3 -->
          <li class="min-w-0 bg-gray-950 border border-gray-800 rounded-xl shadow p-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">

            <label class="flex items-start gap-3 min-w-0">
              <input
                type="checkbox"
                checked
                class="mt-1 w-5 h-5 shrink-0 accent-green-500"
              >

              <span class="min-w-0 break-words">
                <span class="block font-medium text-white">
                  Entregar projeto no GitHub
                </span>
                <span class="text-sm text-gray-400">
                  08/10/2026
                </span>
              </span>
            </label>

            <div class="flex gap-2 md:shrink-0">

              <button
                type="button"
                class="px-4 py-3 rounded-lg bg-green-900 text-green-200 hover:bg-green-800"
              >
                Editar
              </button>

              <button
                type="button"
                class="px-4 py-3 rounded-lg bg-red-950 text-red-300 hover:bg-red-900"
              >
                Excluir
              </button>

            </div>
          </li>

        </ul>

        <p class="mt-4 text-sm text-gray-400">
          2 tarefas pendentes
        </p>

      </section>

    </div>

  </main>

</body>
</html>
